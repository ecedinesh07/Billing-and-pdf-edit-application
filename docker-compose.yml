services:
  db:
    image: postgres:16-alpine
    container_name: docedit-postgres
    environment:
      POSTGRES_USER: docedit
      POSTGRES_PASSWORD: docedit
      POSTGRES_DB: docedit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docedit -d docedit"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: docedit-api
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://docedit:docedit@db:5432/docedit
      DATABASE_URL_SYNC: postgresql://docedit:docedit@db:5432/docedit
      CORS_ORIGINS: http://localhost:4200
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage
      - ./backend/app:/app/app
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
